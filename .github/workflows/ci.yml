name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  e2e:
    name: End-to-end over real sockets
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # The test suite drives the world in-process over an ASGI transport. This
      # boots it as a real uvicorn process and talks to it over a real socket,
      # so anything that only works because of the in-memory shortcut fails
      # here rather than in a reader's terminal.
      - name: End-to-end
        run: python scripts/e2e.py

  smoke:
    name: Measurement smoke run
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # A small sweep on every push. Not the published numbers — this exists so
      # that a change which silently breaks the measurement pipeline fails the
      # build instead of surfacing the next time someone runs it by hand.
      - name: Short sweep
        run: python scripts/run_sweep.py --episodes 25 --out results/smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-results
          path: results/smoke.json
